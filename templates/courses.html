{% extends "layout.html" %}
{% block title %}
    Courses
{% endblock %}
{% block body %}
        <div class="heading-courses">
            <h1>COURSES FOR COMPUTER SCIENCE AND ENGINEERING</h1>
            <div class="accordion" id="accordionExample">
                {% for row in rows %}
                <div class="accordion-item bg-dark">
                    <h2 class="accordion-header">
                    <button class="accordion-button bg-dark text-white  collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{row['id']}}" aria-expanded="false" aria-controls='collapse{{row["id"]}}'>
                        {{row["name"]}}
                    </button>
                    </h2>
                    <div id='collapse{{row["id"]}}' class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <table class="table table-dark table-sm">
                            <tr>
                                <th>Code</th>
                                <th>Credits</th>
                                <th>Description</th>
                            </tr>
                            <tr>
                                <td>{{row["code"]}}</td>
                                <td>{{row["credits"]}}</td>
                                <td>{{row["description"]}}</td>
                            </tr>
                        </table>
                    </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

{% endblock %}
