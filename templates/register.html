{% extends "layout.html" %}
{% block title %}
    Register
{% endblock %}
{% block body %}
    <div class="register-body">
        <form action="/register" method="post">
            <div>
                <label class="form-label">Username</label>
                <input name="username" type="text" id="username" class="form-control w-50" autofocus autocomplete="off">
                <label class="form-label">Password</label>
                <input name="password" type="password" id="password" class="form-control w-50" aria-describedby="passwordHelpBlock" autocomplete="off">
                <label class="form-label">Confirm Password</label>
                <input name="confirmation" type="password" id="confirmation" class="form-control w-50" aria-describedby="passwordHelpBlock" autocomplete="off">
            </div>
            <p></p>
            <button class="login-register-button" type="submit">Register</button>
        </form>
    </div>
{% endblock %}
